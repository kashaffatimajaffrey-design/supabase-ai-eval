name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19 || >=22.12. Pinning the major to 20 left the
          # job one patch release away from an engine error for no benefit.
          node-version: "22"
      # `npm ci` rather than `npm install`: it installs exactly what the lockfile
      # says and fails if the lockfile and package.json disagree, which is the
      # difference between CI reproducing a build and CI resolving a new one.
      - run: npm ci
      - run: npm run build
